# Приоритет, с которым плагин меняет текст сообщения (нужен рестарт).
# LOWEST — плагин красит сообщение ДО того, как его обработает Chatty.
chat-priority: LOWEST

# Текст для предпросмотра в меню
preview-text: "Hello! Так выглядит ваш чат"

# Не больше 21 цвета и 21 градиента (3 ряда в меню).
# Цвета в формате "#RRGGBB" (кавычки обязательны).
