name: GriefChatColor
version: '${project.version}'
main: ru.grief.chatcolor.ChatColorPlugin
api-version: '1.20'
description: Chat color / gradient / font selection menu
softdepend: [Chatty]
commands:
  chatcolor:
    description: Open chat style menu
    usage: /chatcolor
permissions:
  chatcolor.use:
    description: Open /chatcolor menu
    default: false
  chatcolor.color:
    description: Use solid colors
    default: false
  chatcolor.gradient:
    description: Use gradients
    default: false
  chatcolor.font:
    description: Use fonts
    default: false
  chatcolor.style:
    description: Use bold / italic / underline / strikethrough
    default: false
  chatcolor.all:
    description: Everything above
    default: false
    children:
      chatcolor.use: true
      chatcolor.color: true
      chatcolor.gradient: true
      chatcolor.font: true
      chatcolor.style: true
  chatcolor.admin:
    description: Reload config
    default: op
